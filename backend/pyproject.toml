[project]
name = "sociallens-backend"
version = "0.1.0"
description = "SocialLens AI - analytics + AI interpretation backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM108"]  # Depends() defaults are idiomatic; line length is enforced by `ruff format`

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
